# Example configuration file for using Qiskit VQE engine in eDFTpy
# This demonstrates how to configure a subsystem to use Qiskit's VQE solver

[GSYSTEM]
# Global system settings
cell.file = molecule.xyz
cell.format = xyz
grid.ecut = 50.0
grid.nr = [32, 32, 32]
decompose.method = manual

[SUB0]
# Subsystem 0 - using Qiskit VQE
calculator = qiskit
technique = KS
cell.index = [0, 1, 2]  # Atom indices for this subsystem
prefix = sub0_qiskit

# Qiskit-specific options
qiskit.mapper = jordan_wigner  # Options: jordan_wigner, parity, bravyi_kitaev
qiskit.ansatz = uccsd          # Options: uccsd, real_amplitudes
qiskit.optimizer = slsqp       # Options: slsqp, spsa
qiskit.basis = sto-3g          # Basis set for PySCF
qiskit.method = rhf            # RHF or UHF
# qiskit.backend = None        # Quantum backend (None = statevector simulator)

# Standard eDFTpy options
grid.ecut = 50.0
density.initial = atomic
mix.scheme = pulay
mix.coef = 0.7

[PP]
# Pseudopotentials (not directly used by Qiskit, but required by interface)
H = h_pbe.UPF
O = o_pbe.UPF

[JOB]
calctype = [Energy]
task = scf

[OPT]
maxiter = 50
econv = 1.0e-6
pconv = 1.0e-5

[OUTPUT]
density.output = .xsf
append = False

